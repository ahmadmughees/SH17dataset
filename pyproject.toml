[project]
name = "sh17dataset"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofile>=3.9.0",
    "aiohttp>=3.12.6",
    "ultralytics>=8.3.147",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[project.optional-dependencies]
default = [
    "torch==2.6.0",
    "torchvision==0.21.0",
]
cpu = [
    "torch==2.6.0+cpu",
    "torchvision==0.21.0+cpu",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [
  [
    { extra = "default" },
    { extra = "cpu" },
  ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" }
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
